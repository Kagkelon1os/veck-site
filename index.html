<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>o paliouris ton pairnei</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #181818;
      color: white;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 48px);
      border: none;
    }
  </style>
</head>

<body>
  <header>
    <a href="https://veck.io/" target="_blank" rel="noopener noreferrer">
      VECK.IO
    </a>
  </header>

  <iframe
    src="https://veck.io/"
    title="Veck.io"
    allow="fullscreen; autoplay; gamepad"
    allowfullscreen>
  </iframe>
</body>
</html>
